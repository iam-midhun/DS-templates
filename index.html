<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migration Hub</title>
<script>
  /* Apply saved theme before paint (no flash) */
  (function(){ try{ var t=localStorage.getItem('migrationHubTheme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   THEME  —  change colours here and the whole site follows.
   ========================================================================== */
:root, [data-theme="dark"]{
  --bg:#0c0820;            /* page background */
  --panel:rgba(255,255,255,.055);
  --panel-solid:#171034;
  --sidebar:rgba(14,9,36,.78);
  --ink:#f4f0ff;           /* main text */
  --ink-soft:#a79fc9;      /* secondary text */
  --line:rgba(255,255,255,.10);
  --input:rgba(8,5,24,.55);

  --violet:#8b5cf6;
  --pink:#f472b6;
  --amber:#fbbf24;
  --teal:#2dd4bf;
  --ok:#34d399;

  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 55%,#f59e0b 120%);
  --grad-cool:linear-gradient(135deg,#2dd4bf,#8b5cf6);
  --glow:0 10px 40px -10px rgba(139,92,246,.55);

  --term-bg:#08051a;
  --term-ink:#e9e4ff;
  --blob1:rgba(139,92,246,.35);
  --blob2:rgba(236,72,153,.25);
  --blob3:rgba(45,212,191,.18);
}
[data-theme="light"]{
  --bg:#f7f2ff;
  --panel:rgba(255,255,255,.72);
  --panel-solid:#ffffff;
  --sidebar:rgba(255,255,255,.8);
  --ink:#1d1538;
  --ink-soft:#6b6393;
  --line:rgba(80,50,160,.14);
  --input:rgba(255,255,255,.9);

  --violet:#7c3aed;
  --pink:#db2777;
  --amber:#d97706;
  --teal:#0d9488;
  --ok:#059669;

  --grad:linear-gradient(135deg,#7c3aed 0%,#db2777 60%,#f59e0b 130%);
  --grad-cool:linear-gradient(135deg,#0d9488,#7c3aed);
  --glow:0 10px 30px -10px rgba(124,58,237,.45);

  --term-bg:#1b1240;
  --term-ink:#efeaff;
  --blob1:rgba(167,139,250,.45);
  --blob2:rgba(244,114,182,.30);
  --blob3:rgba(45,212,191,.25);
}

/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Outfit',system-ui,sans-serif; font-size:15px;
  min-height:100vh; overflow-x:hidden;
}
/* aurora background */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(600px 420px at 12% 8%, var(--blob1), transparent 70%),
    radial-gradient(560px 460px at 90% 20%, var(--blob2), transparent 70%),
    radial-gradient(640px 500px at 55% 100%, var(--blob3), transparent 70%);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.shell{display:flex;min-height:100vh}

/* ==========================================================================
   SIDEBAR
   ========================================================================== */
.sidebar{
  width:272px; flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--sidebar); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--line); padding:22px 14px 28px;
  z-index:30; transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.brand .logo{
  width:38px;height:38px;border-radius:12px;background:var(--grad);box-shadow:var(--glow);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;
}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:.01em}
.brand small{color:var(--ink-soft);font-size:12px}

.nav-group{margin-top:18px}
.nav-group-label{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-soft);padding:0 10px 8px;
}
.nav-group-label i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--violet));box-shadow:0 0 12px var(--c,var(--violet))}
.nav-sub{font-size:12px;font-weight:600;color:var(--c,var(--ink-soft));padding:10px 10px 4px 12px}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;border:0;background:transparent;color:var(--ink-soft);
  font:500 14px 'Outfit',sans-serif;padding:9px 12px;border-radius:10px;cursor:pointer;
  transition:all .15s ease;margin-bottom:2px;
}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item.active{background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--glow)}
.nav-item .soon{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--amber);
}

/* ==========================================================================
   TOP BAR + MAIN
   ========================================================================== */
.main{flex:1;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px clamp(16px,3vw,36px);
  background:var(--sidebar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.topbar h1{margin:0;font-size:18px;font-weight:600}
.topbar .crumb{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:2px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer}
.theme-toggle{display:flex;padding:4px;border:1px solid var(--line);border-radius:30px;background:var(--panel);cursor:pointer;user-select:none}
.theme-toggle span{padding:5px 12px;border-radius:24px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.theme-toggle span.on{background:var(--grad);color:#fff}

.view{padding:clamp(16px,3vw,36px)}

/* ==========================================================================
   FORM + PREVIEW LAYOUT
   ========================================================================== */
.layout{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:24px;align-items:start}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.form-card{padding:22px}
.form-card h3{
  margin:22px 0 12px;padding-top:18px;border-top:1px dashed var(--line);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.form-card h3:first-child{margin-top:0;padding-top:0;border:0}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:5px}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--input);color:var(--ink);font:400 14px 'Outfit',sans-serif;
  transition:border-color .15s,box-shadow .15s;
}
textarea{resize:vertical;min-height:70px;font:400 13px 'JetBrains Mono',monospace}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
select option{background:var(--panel-solid);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.check{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;cursor:pointer;font-size:13.5px;font-weight:500}
.check input{width:17px;height:17px;margin-top:1px;accent-color:var(--violet);flex-shrink:0}

.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{
  flex:1;min-width:90px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--input);color:var(--ink-soft);font:500 13px 'Outfit',sans-serif;cursor:pointer;transition:all .15s;
}
.toggle button:hover{color:var(--ink);border-color:var(--violet)}
.toggle button.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}

.list-row{display:flex;gap:6px;margin-bottom:6px}
.list-row input{flex:1}
.mini{border:1px solid var(--line);background:var(--input);color:var(--ink-soft);border-radius:10px;padding:0 12px;cursor:pointer;font-size:14px}
.mini:hover{color:var(--pink);border-color:var(--pink)}
.link-btn{background:none;border:0;color:var(--teal);font:600 12.5px 'Outfit',sans-serif;cursor:pointer;padding:2px 0}
.link-btn:hover{text-decoration:underline}

.btn{
  padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:600 13px 'Outfit',sans-serif;cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--violet);color:var(--violet)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.primary.copied{background:var(--ok);box-shadow:none}

/* Preview */
.preview-card{position:sticky;top:84px;padding:18px;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.preview-head .t{font-weight:600;font-size:14px}
.preview-head .tag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--teal);margin-bottom:4px;
}
.terminal{flex:1;min-height:320px;background:var(--term-bg);border-radius:14px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.terminal .bar{display:flex;gap:6px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.terminal .bar i{width:10px;height:10px;border-radius:50%}
.terminal .bar i:nth-child(1){background:#ff6b8b}.terminal .bar i:nth-child(2){background:#fbbf24}.terminal .bar i:nth-child(3){background:#34d399}
.terminal pre{
  margin:0;padding:18px 20px;overflow:auto;flex:1;white-space:pre-wrap;word-wrap:break-word;
  font:400 13px/1.7 'JetBrains Mono',monospace;color:var(--term-ink);
}
.status{display:flex;justify-content:space-between;margin-top:10px;font:400 11px 'JetBrains Mono',monospace;color:var(--ink-soft)}

/* Placeholder (GWS etc.) */
.soon-card{max-width:620px;margin:6vh auto;padding:48px 36px;text-align:center}
.soon-card .ico{font-size:44px;margin-bottom:10px}
.soon-card h2{margin:0 0 8px;font-size:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.soon-card p{color:var(--ink-soft);line-height:1.6;margin:6px 0}

/* DNS checker — Apple-style frosted glass. Has its own palette, independent of the main theme. */
[data-theme="light"] .apple{
  --ap-bg:linear-gradient(135deg,#dbe7ff 0%,#efe3ff 50%,#ffe4ec 100%);
  --ap-text:#1d1d1f; --ap-sub:#6e6e73; --ap-glass:rgba(255,255,255,.66); --ap-line:rgba(60,60,67,.14);
  --ap-field:rgba(120,120,128,.12); --ap-blue:#007aff; --ap-red-bg:rgba(255,59,48,.12); --ap-red:#d70015; --ap-ok:#248a3d;
}
[data-theme="dark"] .apple{
  --ap-bg:linear-gradient(135deg,#0a1124 0%,#1a1034 50%,#0f1c26 100%);
  --ap-text:#f5f5f7; --ap-sub:#98989d; --ap-glass:rgba(44,44,46,.58); --ap-line:rgba(255,255,255,.12);
  --ap-field:rgba(118,118,128,.24); --ap-blue:#0a84ff; --ap-red-bg:rgba(255,69,58,.16); --ap-red:#ff6961; --ap-ok:#30d158;
}
.apple{
  background:var(--ap-bg);color:var(--ap-text);border-radius:28px;padding:clamp(16px,4vw,52px);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
}
.apple .glass{
  max-width:1100px;margin:0 auto;padding:clamp(20px,3vw,36px);border-radius:24px;
  background:var(--ap-glass);border:1px solid var(--ap-line);
  backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.25);
}
.apple h2{margin:0 0 4px;font-size:30px;font-weight:700;letter-spacing:-.02em}
.apple .sub{margin:0 0 20px;color:var(--ap-sub);font-size:14px}
.apple textarea{
  width:100%;min-height:120px;padding:14px 16px;border:0;border-radius:14px;background:var(--ap-field);color:var(--ap-text);
  font:400 13px/1.6 'JetBrains Mono',ui-monospace,monospace;resize:vertical;
}
.apple textarea:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ap-blue) 35%,transparent)}
.apple .ap-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.apple .ap-btn{
  border:0;border-radius:980px;padding:10px 22px;font:600 14px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--ap-blue);color:#fff;cursor:pointer;transition:transform .12s ease,filter .12s ease;
}
.apple .ap-btn:hover{filter:brightness(1.08)}
.apple .ap-btn:active{transform:scale(.97)}
.apple .ap-btn.soft{background:var(--ap-field);color:var(--ap-blue)}
.apple .ap-status{font-size:13px;color:var(--ap-ok);font-weight:500}
.apple .ap-table{margin-top:18px;overflow-x:auto;border-radius:16px;border:1px solid var(--ap-line);background:var(--ap-glass)}
.apple table{width:100%;border-collapse:collapse}
.apple th{
  text-align:left;padding:13px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ap-sub);background:transparent;border-bottom:1px solid var(--ap-line);
}
.apple td{padding:14px 16px;border-top:1px solid var(--ap-line);vertical-align:top;font:400 12px/1.6 'JetBrains Mono',ui-monospace,monospace;color:var(--ap-text)}
.apple tbody tr:first-child td{border-top:0}
.apple tbody tr:hover td{background:var(--ap-field)}
.apple td.dom{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-weight:600;font-size:14px}
.apple .ap-none{display:inline-block;font:500 11px -apple-system,BlinkMacSystemFont,sans-serif;padding:3px 10px;border-radius:980px;background:var(--ap-red-bg);color:var(--ap-red)}
.apple .ap-empty{text-align:center;color:var(--ap-sub);padding:40px 16px;font:400 14px -apple-system,BlinkMacSystemFont,sans-serif}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel-solid);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:12px;box-shadow:var(--glow);opacity:0;transform:translateY(14px);transition:all .25s;z-index:99;font-weight:600;font-size:13px}
.toast.show{opacity:1;transform:none}

/* Responsive */
@media(max-width:1020px){
  .layout{grid-template-columns:1fr}
  .preview-card{position:static;max-height:none}
}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div><b>Migration Hub</b><small>Reply templates &amp; tools</small></div>
    </div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn" type="button">☰</button>
        <div><span class="crumb" id="crumb"></span><h1 id="pageTitle"></h1></div>
      </div>
      <div class="theme-toggle" id="themeToggle"><span data-t="light">Light</span><span data-t="dark">Dark</span></div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<div class="toast" id="toast">Copied to clipboard</div>

<script>
/* ==========================================================================
   HOW THIS FILE IS ORGANISED  (search for the "█ SECTION" markers)

   █ SECTION 1  SETTINGS         brands, article links, shared constants
   █ SECTION 2  HELPERS          small text helpers used by templates
   █ SECTION 3  PRE-MIGRATION    wording blocks + 5 email types (DNS option is a dropdown)
   █ SECTION 4  POST-MIGRATION   cPanel, TITAN (incl. secure link option), Exchange
   █ SECTION 5  GOOGLE WORKSPACE reserved — paste the new template here later
   █ SECTION 6  INTERNAL         case notes
   █ SECTION 7  DNS CHECKER      live lookup tool
   █ SECTION 8  SIDEBAR MENU     which template appears where
   █ SECTION 9  ENGINE           rendering code — you normally never touch this

   TO EDIT WORDING: find the template in sections 3–6 and edit the text inside
   the quotes. Placeholders like ${s.sourcePlan} are filled from the form.
   ========================================================================== */


/* ██████████████████████  SECTION 1 — SETTINGS  ██████████████████████ */

const REG = {};     // all registered templates (filled by register() below)
const STATE = {};   // each template's current form values

const TITAN_FORWARDER_ARTICLE = 'https://support.titan.email/hc/en-us/articles/360038282094-Setup-Outgoing-Forwarding';

/* Brand separation: never mix Crazy Domains and Vodien links. Each brand has its own block. */
const BRANDS = {
  crazydomains: {
    label: 'Crazy Domains',
    titanWebmail: 'https://crazydomains.titan.email/login/',
    titanFullArticles: [
      'https://www.crazydomains.com.au/help/article/how-to-use-titan-email',
      'https://www.crazydomains.com.au/help/article/set-up-titan-email-on-iphone-ipad-or-ipod-touch',
      'https://www.crazydomains.com.au/help/article/how-to-reset-your-titan-email-password',
      'https://support.titan.email/hc/en-us/articles/25005307786905-Enable-Titan-on-other-apps',

    ],
    titanQuickArticles: [
      'https://www.crazydomains.com.au/help/article/how-to-use-titan-email',
      'https://www.crazydomains.com.au/help/article/set-up-titan-email-on-iphone-ipad-or-ipod-touch',

    cpanelAccessGuide: 'https://www.crazydomains.com.au/help/article/how-to-access-your-cpanel',
    cpanelGuides: [
      { label: 'Email password change',   url: 'https://www.crazydomains.com.au/help/article/how-to-change-email-account-password-cpanel' },
      { label: 'Email setup guide',       url: 'https://www.crazydomains.com.au/help/article/email-setup-guide' },
      { label: 'cPanel access guide',     url: 'https://www.crazydomains.com.au/help/article/how-to-access-your-cpanel' },
      { label: 'iPhone/iPad setup',       url: 'https://www.crazydomains.com.au/help/article/how-to-set-up-email-on-your-iphone-or-ipad' },
      { label: 'iPhone/iPad setup guide', url: 'https://www.crazydomains.com.au/help/article/iphone-ipad-email-setup-guide' },
      { label: 'Outlook 2016 setup',      url: 'https://www.crazydomains.com.au/help/article/how-to-set-up-outlook-2016-to-check-your-email' }
    ]
  },
  vodien: {

    titanQuickArticles: [ 'https://www.vodien.com/help/article/the-titan-email-account' ],
    titanPasswordResetArticle: 'https://www.vodien.com/help/article/the-titan-email-account',
    titanDnsRecordsArticle: 'https://www.vodien.com/help/article/set-up-mx-and-txt-records-for-vodien-titan-email',
    cpanelAccessGuide: 'https://www.vodien.com/help/article/email-setup-guides',
    cpanelGuides: [
      { label: 'Email setup guides',    url: 'https://www.vodien.com/help/article/email-setup-guides' },
      { label: 'Change email password', url: 'https://www.vodien.com/help/article/change-email-password-in-vodien' }
    ]
  }
};

/* Exchange help articles (Crazy Domains) */
const EXCHANGE_ARTICLES = [
  'https://www.crazydomains.com.au/help/article/getting-started-guide-email-exchange-in-outlook',
  'https://www.crazydomains.com.au/help/article/how-to-set-up-email-exchange-with-outlook-2019',
  'https://www.crazydomains.com.au/help/article/how-to-forward-emails-with-email-exchange',
  'https://www.crazydomains.com.au/help/article/how-to-reset-a-mailbox-password-for-email-exchange',

/* Form fields for a pre-migration page */
function preFields(T) {
  const external = s => s.dns === 'external';
  const f = [
    { id: 'dns',           type: 'select', label: 'DNS management', options: DNS_OPTIONS },
    { id: 'sourcePlan',    type: 'text', label: 'Source plan',      placeholder: 'e.g. BizValue' },
    { id: 'destPlan',      type: 'text', label: 'Destination plan', placeholder: 'e.g. BizUltimate' },
    { type: 'heading', label: 'Check findings' },
    { id: 'emailCount',    type: 'text', label: 'Email accounts found', placeholder: 'e.g. 5' },
    { id: 'emailNames',    type: 'list', label: 'Email account names (optional)', addLabel: 'Add email account', placeholder: 'user@example.com', default: [] },
    { id: 'websiteCount',  type: 'text', label: 'Websites found', placeholder: 'e.g. 1' },
    { id: 'websiteStatus', type: 'text', label: 'Website status', placeholder: 'e.g. Working / Remote' },
    { id: 'remoteDns',     type: 'text', label: 'DNS provider', placeholder: 'e.g. Cloudflare / GoDaddy', showIf: external }
  ];
  if (T.titanRecords) {
    f.push({ id: 'includeRecords', type: 'check', label: 'Include TITAN MX + SPF records (easy copy-paste for the customer)', default: true, showIf: external });
  }
  f.push({ type: 'heading', label: 'DNS checker links' });
  f.push({ id: 'dnsUrls', type: 'list', label: 'DNS checker URLs', addLabel: 'Add another URL', placeholder: 'https://dnschecker.org', default: [''] });
  return f;
}

/* The generator: turns a PRE_TYPES entry into reply text */
function buildPre(T) {
  const C = PRE_COMMON;
  return (s, g) => {
    const external = s.dns === 'external';
    const withRecords = external && T.titanRecords && s.includeRecords;
    const n = (v, d) => (v && String(v).trim()) || d;
    const provider = n(s.remoteDns, '[DNS provider]');
    const names = clean(s.emailNames);
    const emailLine = `Email accounts: ${n(s.emailCount, '[count]')} email account(s) found under ${g.primary}` +
      (names.length ? `\n\nThey are:\n${names.join('\n')}\n` : '');
    const webLine = `Websites: ${n(s.websiteCount, '[count]')} website(s) hosted on the source plan (Status: ${n(s.websiteStatus, '[status]')})`;
    const nsLine = `Nameservers (NS): NS records are managed by ${external ? provider : 'us'}`;
    const findings = join([...T.order.map(k => (k === 'email' ? emailLine : webLine)), nsLine], '\n');
    const urls = clean(s.dnsUrls);

    const intro = join([
      `${C.greeting} We have received your ${T.request} for the following domain(s):`,
      g.domainLines,
      `This covers ${T.covers} from the ${n(s.sourcePlan, '[source plan]')} to the ${n(s.destPlan, '[destination plan]')}.`
    ]);

    const afterMigration = external
      ? join([
          `Since your NS records are managed by ${provider}, ${T.when}, ${T.externalNeeds} will need to be updated on your end to ensure ${T.why}.`,
          withRecords
            ? `${C.noAccessNote} The required records are listed below, so you (or your DNS provider) can add them once we confirm that the migration is complete.`
            : `${C.noAccessNote} We will share the ${T.closing === 'share' ? 'updated' : 'required'} DNS/server settings with you once the migration is complete, so you (or your DNS provider) can update the records accordingly.`,
          withRecords && titanRecordsBlock(g.brand)
        ])
      : join([
          `Since the NS records are managed by us, ${T.when}, ${T.managedNeeds} will need to be updated to ensure ${T.why}.`,
          C.managedNote
        ]);

    const pleaseNote = join([
      'Please note:',
      lines([ external ? C.propagationExternal : C.propagation, T.hasEmail && C.reconfigure ])
    ]);

    const closing =
      T.closing === 'share'        ? join([ 'We will share the updated DNS/server settings with you once the migration is complete.', C.thanks ]) :
      T.closing === 'update'       ? join([ 'We will update you once the migration is complete.', C.thanks ]) :
      T.closing === 'update-plain' ? 'We will update you once the migration is complete.' : '';

    return join([
      intro,
      C.summaryTitle,
      C.summaryIntro,
      findings,
      `${C.dnsCheckIntro}\n${urls.length ? urls.join('\n') : '[DNS Checker URL]'}`,
      `We have also attached screenshots of the current ${T.screenshots} prior to the migration, for your reference.`,
      C.afterTitle,
      afterMigration,
      pleaseNote,
      closing
    ]);
  };
}

/* Registers the 5 pre-migration pages */
Object.entries(PRE_TYPES).forEach(([key, T]) => {
  register({
    id: `pre-${key}`,
    title: `${T.label} — Pre-Migration Reply`,
    tag: 'Pre-Migration',
    globals: T.titanRecords ? ['domains', 'brand'] : ['domains'],
    fields: preFields(T),
    build: buildPre(T)
  });

    { id: 'diskDest',   type: 'textarea', label: 'Disk usage on destination (paste du -sch output)' },
    { type: 'heading', label: 'Post-migration checks' },
    { id: 'dnsStatus', type: 'text', label: 'DNS status', default: 'DNS updated' },
    { id: 'verified', type: 'toggle', label: 'Verified count of email accounts & emails in webmail', options: [{ v: 'Yes', l: 'Yes' }, { v: 'No', l: 'No' }] },
    { id: 'archived', type: 'toggle', label: 'Source archived and old backup deleted', options: [{ v: 'Yes', l: 'Yes' }, { v: 'No', l: 'No' }] }
  ],
  build: (s, g) => {
    const d = (v, fallback) => v.trim() || fallback;
    return [
      'Pre-migration notes/pulse:',
      '',
      `Row ID: ${d(s.rowId, '[Row ID]')}`,
      '',
      `What is being migrated: ${s.type}`,
      '',
      'Domains:',
      '',
      ...g.domains,
      '',
      'Disk usage on Source',
      '',
      d(s.diskSource, '[paste du -sch output]'),
      '',
      `Source: ${d(s.source, '[source server]')}`,
      '',
      `Destination: ${d(s.dest, '[destination server]')}`,
      '',
      '---------------------------------------------------------------',
      '',
      'Post migration notes/pulse:',
      '',
      'Disk usage on Destination:',
      '',
      d(s.diskDest, '[paste du -sch output]'),
      '',
      `DNS Status : ${d(s.dnsStatus, 'DNS updated')}`,
      '',

    ].join('\n');
  }
});


/* ██████████████████████  SECTION 7 — DNS CHECKER  ██████████████████████ */

const DNS = { text: '', status: '', results: null };

async function dohQuery(name, type) {
  try {
    const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`, { headers: { Accept: 'application/dns-json' } });
    const j = await r.json();
    return j.Answer || [];
  } catch (e) { return []; }
}

async function runDnsLookup() {
  const domains = DNS.text.split('\n').map(x => x.trim()).filter(Boolean);
  if (!domains.length) { DNS.status = 'Please enter at least one domain.'; return drawDns(); }
  DNS.status = `Querying live DNS records for ${domains.length} domain(s)…`; DNS.results = null; drawDns();

  const results = [];
  for (const domain of domains) {
    const [a, ns, mx] = await Promise.all([dohQuery(domain, 'A'), dohQuery(domain, 'NS'), dohQuery(domain, 'MX')]);
    const mxHostA = [];
    for (const m of mx) {
      const host = m.data.trim().split(/\s+/).pop().replace(/\.$/, '');   // "10 mail.x.com." -> "mail.x.com"
      const recs = await dohQuery(host, 'A');
      recs.forEach(r => mxHostA.push(`${host} → ${r.data}`));
    }
    results.push({ domain, a: a.map(x => x.data), ns: ns.map(x => x.data), mx: mx.map(x => x.data), mxHostA });
  }
  DNS.results = results;
  DNS.status = `Done — ${domains.length} domain(s) processed.`;
  drawDns();
}

function dnsCell(arr, label) {
  return arr.length ? arr.map(x => `<div>${esc(x)}</div>`).join('') : `<span class="ap-none">${label}</span>`;
}

function drawDns() {
  const rows = DNS.results
    ? DNS.results.map(r => `<tr>
        <td class="dom">${esc(r.domain)}</td>
        <td>${dnsCell(r.a, 'No A record')}</td>
        <td>${dnsCell(r.ns, 'No NS record')}</td>
        <td>${dnsCell(r.mx, 'No MX record')}</td>
        <td>${dnsCell(r.mxHostA, 'No MX host A')}</td></tr>`).join('')
    : `<tr><td colspan="5" class="ap-empty">Enter domains above and click “Lookup DNS Records”.</td></tr>`;

  $('#view').innerHTML = `
    <div class="apple"><div class="glass">
      <h2>DNS Record Checker</h2>
      <p class="sub">Enter one domain per line to see its A, NS and MX records, plus the A records of the MX hosts.</p>
      <textarea id="dnsInput" rows="5" placeholder="example.com">${esc(DNS.text)}</textarea>
      <div class="ap-row">
        <button class="ap-btn" id="dnsRun" type="button">Lookup DNS Records</button>
        <button class="ap-btn soft" id="dnsCopy" type="button">Copy results</button>
        <span class="ap-status">${esc(DNS.status)}</span>
      </div>
      <div class="ap-table"><table>
        <thead><tr><th>Domain</th><th>A Records</th><th>NS Records</th><th>MX Records</th><th>MX Host A</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div></div>`;
  $('#dnsInput').addEventListener('input', e => { DNS.text = e.target.value; });
  $('#dnsRun').addEventListener('click', runDnsLookup);
  $('#dnsCopy').addEventListener('click', () => {
    if (!DNS.results) return;
    copyText(DNS.results.map(r => `Domain: ${r.domain}\nA: ${r.a.join(', ') || 'None'}\nNS: ${r.ns.join(', ') || 'None'}\nMX: ${r.mx.join(', ') || 'None'}\nMX Host A: ${r.mxHostA.join(', ') || 'None'}`).join('\n-----------------------------------\n'));
  });
}

register({ id: 'tool-dns', title: 'DNS Record Checker', custom: drawDns });

/* ██████████████████████  SECTION 9 — ENGINE (don't edit)  ██████████████████████ */

/* Registry ------------------------------------------------------------- */
function defaultsOf(t) {
  const s = {};
  (t.fields || []).forEach(f => {
    if (!f.id) return;
    if (f.type === 'list')        s[f.id] = [...(f.default !== undefined ? f.default : [''])];
    else if (f.type === 'check')  s[f.id] = f.default || false;
    else if (f.type === 'toggle' || f.type === 'select') s[f.id] = f.default !== undefined ? f.default : f.options[0].v;
    else                          s[f.id] = f.default !== undefined ? f.default : '';
  });
  return s;
}
function register(t) { REG[t.id] = t; STATE[t.id] = defaultsOf(t); }

/* Shared (global) fields ---------------------------------------------- */
const GLOBAL = { domains: '', ticket: '', brand: 'crazydomains', autoPw: true };

function ctx() {
  const domains = GLOBAL.domains.split(/[\n,]+/).map(x => x.trim()).filter(Boolean);
  const list = domains.length ? domains : ['[domain]'];
  const human = list.length === 1 ? list[0]
              : list.length === 2 ? `${list[0]} and ${list[1]}`
              : `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`;
  return {
    domains: list,
    primary: list[0],
    domainList: human,
    domainLines: list.join('\n'),
    ticket: GLOBAL.ticket.trim(),
    brand: BRANDS[GLOBAL.brand],
    password: (explicit) => (explicit || '').trim() || (GLOBAL.autoPw ? `Migrate@${GLOBAL.ticket.trim() || '[Ticket ID]'}` : '[password]')
  };
}

/* Utilities ------------------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let current = null, OUT = '';

function toast(msg) {
  const el = $('#toast'); el.textContent = msg || 'Copied to clipboard'; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast();
}

/* Rendering ------------------------------------------------------------ */
function globalsHTML(t) {
  const g = t.globals || [];
  let h = '';
  if (g.includes('domains')) h += `<h3>Case details</h3>
    <div class="field"><label>Domain(s)</label>
      <textarea data-g="domains" rows="2" placeholder="One per line or comma-separated&#10;example.com">${esc(GLOBAL.domains)}</textarea></div>`;
  if (g.includes('ticket')) h += `<div class="field"><label>Ticket ID</label>
      <input type="text" data-g="ticket" value="${esc(GLOBAL.ticket)}" placeholder="E-586620"></div>
      <label class="check"><input type="checkbox" data-g="autoPw" ${GLOBAL.autoPw ? 'checked' : ''}><span>Auto-fill password as Migrate@[Ticket ID]</span></label>`;
  if (g.includes('brand')) h += `<div class="field"><label>Brand</label><div class="toggle">
      ${Object.entries(BRANDS).map(([k, b]) => `<button type="button" data-gbrand="${k}" class="${GLOBAL.brand === k ? 'on' : ''}">${b.label}</button>`).join('')}</div></div>`;
  return h;
}

function fieldHTML(f, s) {
  if (f.showIf && !f.showIf(s)) return '';
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  const v = f.id ? s[f.id] : null;
  switch (f.type) {
    case 'heading':  return `<h3>${f.label}</h3>`;
    case 'text':
    case 'date':     return `<div class="field"><label>${f.label}</label><input type="${f.type}" data-f="${f.id}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}">${hint}</div>`;
    case 'textarea': return `<div class="field"><label>${f.label}</label><textarea data-f="${f.id}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>${hint}</div>`;
    case 'check':    return `<label class="check"><input type="checkbox" data-f="${f.id}" ${v ? 'checked' : ''}><span>${f.label}</span></label>`;
    case 'select':   return `<div class="field"><label>${f.label}</label><select data-f="${f.id}">${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${o.l}</option>`).join('')}</select>${hint}</div>`;
    case 'toggle':   return `<div class="field"><label>${f.label}</label><div class="toggle">${f.options.map(o => `<button type="button" data-tf="${f.id}" data-v="${esc(o.v)}" class="${o.v === v ? 'on' : ''}">${o.l}</button>`).join('')}</div>${hint}</div>`;
    case 'list': {
      const rows = v.map((x, i) => `<div class="list-row"><input type="text" data-f="${f.id}" data-i="${i}" value="${esc(x)}" placeholder="${esc(f.placeholder || '')}"><button type="button" class="mini" data-del="${f.id}" data-i="${i}" title="Remove">✕</button></div>`).join('');
      return `<div class="field"><label>${f.label}</label>${rows || '<div class="hint" style="margin:0 0 6px">None added yet</div>'}<button type="button" class="link-btn" data-add="${f.id}">+ ${f.addLabel || 'Add'}</button></div>`;
    }
    case 'button':   return `<div class="field"><button type="button" class="btn" data-act="${f.id}">${f.label}</button></div>`;
  }
  return '';
}

function renderForm() {
  const t = REG[current], s = STATE[current];
  $('#form').innerHTML = globalsHTML(t) + t.fields.map(f => fieldHTML(f, s)).join('');
}

function regen() {
  const t = REG[current];
  OUT = t.build(STATE[current], ctx());
  $('#output').textContent = OUT;
  const words = OUT.trim().split(/\s+/).filter(Boolean).length;
  $('#wc').textContent = `${words} words`;
  $('#cc').textContent = `${OUT.length} characters`;
}

function showTemplate(t) {
  $('#view').innerHTML = `
    <div class="layout">
      <div class="card form-card" id="form"></div>
      <div class="card preview-card">
        <div class="preview-head">
          <div><span class="tag">${esc(t.tag || '')}</span><div class="t">${esc(t.title)}</div></div>
          <div style="display:flex;gap:8px"><button class="btn" id="resetBtn" type="button">Reset</button><button class="btn primary" id="copyBtn" type="button">Copy</button></div>
        </div>
        <div class="terminal"><div class="bar"><i></i><i></i><i></i></div><pre id="output"></pre></div>
        <div class="status"><span id="wc"></span><span id="cc"></span></div>
      </div>
    </div>`;
  renderForm(); regen();
  $('#copyBtn').addEventListener('click', async () => {
    await copyText(OUT);
    const b = $('#copyBtn'); b.textContent = 'Copied ✓'; b.classList.add('copied');
    setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('copied'); }, 1500);
  });
  $('#resetBtn').addEventListener('click', () => { STATE[current] = defaultsOf(REG[current]); renderForm(); regen(); });
  bindFormEvents();
}

function showSoon(label) {
  $('#view').innerHTML = `<div class="card soon-card"><div class="ico">🚧</div><h2>${esc(label)}</h2>
    <p>This section is reserved and coming soon.</p>
    <p style="font-size:13px">will update in future>`;
}

/* Form events (delegated — bound once per template view) --------------- */
function bindFormEvents() {
  const form = $('#form');
  const S = () => STATE[current];

  form.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.g) { GLOBAL[el.dataset.g] = el.value; return regen(); }
    if (!el.dataset.f || el.type === 'checkbox' || el.tagName === 'SELECT') return;
    if (el.dataset.i !== undefined) S()[el.dataset.f][+el.dataset.i] = el.value;
    else S()[el.dataset.f] = el.value;
    regen();
  });

  form.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.g === 'autoPw') { GLOBAL.autoPw = el.checked; return regen(); }
    if (!el.dataset.f) return;
    if (el.type === 'checkbox') S()[el.dataset.f] = el.checked;
    else if (el.tagName === 'SELECT') S()[el.dataset.f] = el.value;
    else return;
    renderForm(); regen();           // re-render so showIf rules update
  });

  form.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const s = S(), t = REG[current];
    if (b.dataset.gbrand)  { GLOBAL.brand = b.dataset.gbrand; renderForm(); return regen(); }
    if (b.dataset.tf)      { s[b.dataset.tf] = b.dataset.v; renderForm(); return regen(); }
    if (b.dataset.add)     { s[b.dataset.add].push(''); renderForm(); return regen(); }
    if (b.dataset.del)     { s[b.dataset.del].splice(+b.dataset.i, 1); renderForm(); return regen(); }
    if (b.dataset.act)     { const f = t.fields.find(x => x.id === b.dataset.act); f.run(s); renderForm(); return regen(); }
  });
}

/* Navigation ----------------------------------------------------------- */
function buildNav() {
  $('#nav').innerHTML = NAV.map(g => `
    <div class="nav-group" style="--c:${g.color}">
      <div class="nav-group-label"><i></i>${g.group}</div>
      ${g.sections.map(sec => `
        ${sec.sub ? `<div class="nav-sub" style="--c:${sec.color}">${sec.sub}</div>` : ''}
        ${sec.items.map(it => `<button type="button" class="nav-item" data-id="${it.id}" data-group="${esc(g.group)}">
            <span>${it.label}</span>${it.soon ? '<span class="soon">Soon</span>' : ''}</button>`).join('')}
      `).join('')}
    </div>`).join('');
}

function findNavItem(id) {
  for (const g of NAV) for (const sec of g.sections) for (const it of sec.items) if (it.id === id) return { it, g, sec };
  return null;
}

function go(id) {
  const found = findNavItem(id); if (!found) return;
  current = id;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const t = REG[id];
  $('#crumb').textContent = found.g.group + (found.sec.sub ? ' · ' + found.sec.sub : '');
  $('#pageTitle').textContent = t ? t.title : found.it.label;
  if (found.it.soon || !t) showSoon(found.it.label);
  else if (t.custom) t.custom();
  else showTemplate(t);
  $('#sidebar').classList.remove('open');
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

/* Theme + mobile menu -------------------------------------------------- */
function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  document.querySelectorAll('#themeToggle span').forEach(x => x.classList.toggle('on', x.dataset.t === th));
  try { localStorage.setItem('migrationHubTheme', th); } catch (e) {}
}
document.querySelectorAll('#themeToggle span').forEach(x => x.addEventListener('click', () => setTheme(x.dataset.t)));
setTheme(document.documentElement.getAttribute('data-theme') || 'dark');
$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

/* Boot ----------------------------------------------------------------- */
buildNav();
$('#nav').addEventListener('click', e => { const b = e.target.closest('.nav-item'); if (b) go(b.dataset.id); });
go(location.hash.slice(1) && findNavItem(location.hash.slice(1)) ? location.hash.slice(1) : 'pre-email-web');
</script>

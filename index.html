<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
 
<style>
/* ==========================================================================
   THEME  —  change colours here and the whole site follows.
   Light = warm paper.  Dark = deep green-black.
   ========================================================================== */
:root, [data-theme="light"]{
  --bg:#f3f0e8;            /* page background */
  --surface:#fffdf8;       /* cards / panels */
  --surface-2:#f8f5ec;     /* inputs, subtle fills */
  --sidebar:#ece8dc;
  --ink:#1d1c18;           /* main text */
  --ink-soft:#6c685b;      /* secondary text */
  --line:#ddd7c6;
  --line-strong:#c9c2ad;
 
  --accent:#0f6b5c;        /* primary accent */
  --accent-ink:#ffffff;    /* text on accent */
  --accent-soft:rgba(15,107,92,.11);
  --ring:rgba(15,107,92,.28);
 
  /* group colours used by the sidebar dots */
  --violet:#4f6bd8;
  --pink:#d6567a;
  --amber:#c98200;
  --teal:#0f9d8a;
  --ok:#1f8a4c;
 
  --draft-bg:#ffffff;      /* the reply preview "paper" */
  --draft-ink:#23221d;
  --draft-head:#f1eee3;
  --shadow:0 1px 2px rgba(40,34,10,.06),0 8px 24px -12px rgba(40,34,10,.18);
}
[data-theme="dark"]{
  --bg:#0f1210;
  --surface:#171b18;
  --surface-2:#1d221e;
  --sidebar:#131714;
  --ink:#ecebe3;
  --ink-soft:#97a099;
  --line:#2a312b;
  --line-strong:#3a443c;
 
  --accent:#4fd1b0;
  --accent-ink:#06231c;
  --accent-soft:rgba(79,209,176,.12);
  --ring:rgba(79,209,176,.30);
 
  --violet:#8fa2ff;
  --pink:#f08aa8;
  --amber:#f2b84b;
  --teal:#4fd1b0;
  --ok:#5fd68c;
 
  --draft-bg:#0b0e0c;
  --draft-ink:#e6e8e1;
  --draft-head:#141915;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
 
/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif; font-size:15px; line-height:1.45;
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
 
.shell{display:flex;min-height:100vh}
 
/* ==========================================================================
   SIDEBAR
   ========================================================================== */
.sidebar{
  width:268px; flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--sidebar); border-right:1px solid var(--line);
  padding:24px 14px 28px; z-index:30; transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid var(--line);margin-bottom:6px}
.brand .logo{
  width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:600 19px 'Fraunces',serif;
}
.brand b{display:block;font:600 17px 'Fraunces',serif;letter-spacing:-.01em}
.brand small{color:var(--ink-soft);font-size:12px}
 
.nav-group{margin-top:20px}
.nav-group-label{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
  color:var(--ink-soft);padding:0 10px 8px;
}
.nav-group-label i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent));transform:rotate(45deg)}
.nav-sub{font-size:12px;font-weight:600;color:var(--c,var(--ink-soft));padding:10px 10px 4px 12px}
.nav-item{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;border:0;background:transparent;color:var(--ink-soft);
  font:500 14px 'Instrument Sans',sans-serif;padding:8px 12px 8px 14px;border-radius:8px;cursor:pointer;
  transition:background .15s,color .15s;margin-bottom:1px;
}
.nav-item:hover{background:var(--accent-soft);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.nav-item .soon{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;border:1px solid var(--line-strong);color:var(--amber);
}
 
/* ==========================================================================
   TOP BAR + MAIN
   ========================================================================== */
.main{flex:1;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px clamp(16px,3vw,36px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar h1{margin:0;font:600 22px 'Fraunces',serif;letter-spacing:-.015em}
.topbar .crumb{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);display:block;margin-bottom:2px}
.menu-btn{display:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:16px;cursor:pointer}
.theme-toggle{display:flex;padding:3px;border:1px solid var(--line-strong);border-radius:30px;background:var(--surface);cursor:pointer;user-select:none}
.theme-toggle span{padding:5px 13px;border-radius:24px;font-size:12px;font-weight:600;color:var(--ink-soft);transition:all .15s}
.theme-toggle span.on{background:var(--accent);color:var(--accent-ink)}
 
.view{padding:clamp(16px,3vw,36px)}
 
/* ==========================================================================
   FORM + PREVIEW LAYOUT
   ========================================================================== */
.layout{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.form-card{padding:22px}
.form-card h3{
  display:flex;align-items:center;gap:10px;
  margin:24px 0 14px;padding-top:0;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);
}
.form-card h3::after{content:'';flex:1;height:1px;background:var(--line)}
.form-card h3:first-child{margin-top:0}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:5px}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface-2);color:var(--ink);font:400 14px 'Instrument Sans',sans-serif;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
textarea{resize:vertical;min-height:70px;font:400 13px/1.5 'JetBrains Mono',monospace}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--ring)}
select option{background:var(--surface);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 
.check{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;cursor:pointer;font-size:13.5px;font-weight:500}
.check input{width:17px;height:17px;margin-top:1px;accent-color:var(--accent);flex-shrink:0}
 
.toggle{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.toggle button{
  flex:1;min-width:90px;padding:8px 10px;border:0;border-right:1px solid var(--line-strong);
  background:transparent;color:var(--ink-soft);font:500 13px 'Instrument Sans',sans-serif;cursor:pointer;transition:all .15s;
}
.toggle button:last-child{border-right:0}
.toggle button:hover{color:var(--ink);background:var(--accent-soft)}
.toggle button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
 
.list-row{display:flex;gap:6px;margin-bottom:6px}
.list-row input{flex:1}
.mini{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);border-radius:8px;padding:0 12px;cursor:pointer;font-size:14px}
.mini:hover{color:var(--pink);border-color:var(--pink)}
.link-btn{background:none;border:0;color:var(--accent);font:600 12.5px 'Instrument Sans',sans-serif;cursor:pointer;padding:2px 0}
.link-btn:hover{text-decoration:underline}
 
.btn{
  padding:8px 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font:600 13px 'Instrument Sans',sans-serif;cursor:pointer;transition:all .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.primary.copied{background:var(--ok);border-color:var(--ok);color:#fff}
 
/* Preview — styled like a draft message */
.preview-card{position:sticky;top:84px;padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 110px);overflow:hidden}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.preview-head .t{font:600 16px 'Fraunces',serif;letter-spacing:-.01em}
.preview-head .tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:4px;
}
.terminal{flex:1;min-height:320px;background:var(--draft-bg);display:flex;flex-direction:column;overflow:hidden}
.terminal .bar{display:flex;align-items:center;gap:6px;padding:8px 18px;background:var(--draft-head);border-bottom:1px solid var(--line)}
.terminal .bar i{display:none}
.terminal .bar::before{content:'DRAFT REPLY';font:600 10.5px 'Instrument Sans',sans-serif;letter-spacing:.12em;color:var(--ink-soft)}
.terminal pre{
  margin:0;padding:20px 22px;overflow:auto;flex:1;white-space:pre-wrap;word-wrap:break-word;
  font:400 13px/1.75 'JetBrains Mono',monospace;color:var(--draft-ink);
}
.status{display:flex;justify-content:space-between;padding:9px 18px;border-top:1px solid var(--line);background:var(--surface);font:400 11px 'JetBrains Mono',monospace;color:var(--ink-soft)}
 
/* Pages with several separate output boxes (e.g. Case Notes) */
.preview-card.multi{overflow-y:auto}
.out-block{border-top:1px solid var(--line)}
.out-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--draft-head);font:600 12px 'Instrument Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.out-head .wc{font:400 11px 'JetBrains Mono',monospace;text-transform:none;letter-spacing:0}
.out-block .terminal{flex:none;min-height:160px}
.out-block pre{max-height:360px}
 
/* Placeholder (GWS etc.) */
.soon-card{max-width:560px;margin:6vh auto;padding:48px 36px;text-align:center}
.soon-card .ico{font-size:40px;margin-bottom:10px}
.soon-card h2{margin:0 0 8px;font:600 26px 'Fraunces',serif;color:var(--accent)}
.soon-card p{color:var(--ink-soft);line-height:1.6;margin:6px 0}
 
/* DNS checker — now uses the same palette as the rest of the site */
.apple{background:transparent;color:var(--ink)}
.apple .glass{max-width:1100px;margin:0 auto;padding:clamp(20px,3vw,32px);border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.apple h2{margin:0 0 4px;font:600 26px 'Fraunces',serif;letter-spacing:-.015em}
.apple .sub{margin:0 0 18px;color:var(--ink-soft);font-size:14px}
.apple textarea{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);font:400 13px/1.6 'JetBrains Mono',monospace;resize:vertical}
.apple textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.apple .ap-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.apple .ap-btn{border:1px solid var(--accent);border-radius:8px;padding:9px 18px;font:600 13.5px 'Instrument Sans',sans-serif;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .12s,transform .12s}
.apple .ap-btn:hover{filter:brightness(1.08)}
.apple .ap-btn:active{transform:scale(.98)}
.apple .ap-btn.soft{background:var(--surface-2);color:var(--ink);border-color:var(--line-strong)}
.apple .ap-status{font-size:13px;color:var(--ok);font-weight:500}
.apple .ap-table{margin-top:18px;overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.apple table{width:100%;border-collapse:collapse}
.apple th{text-align:left;padding:12px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);background:var(--surface-2);border-bottom:1px solid var(--line)}
.apple td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:top;font:400 12px/1.6 'JetBrains Mono',monospace;color:var(--ink)}
.apple tbody tr:first-child td{border-top:0}
.apple tbody tr:hover td{background:var(--accent-soft)}
.apple td.dom{font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:14px}
.apple .ap-none{display:inline-block;font:600 11px 'Instrument Sans',sans-serif;padding:3px 10px;border-radius:20px;background:rgba(214,86,122,.14);color:var(--pink)}
.apple .ap-empty{text-align:center;color:var(--ink-soft);padding:40px 16px;font:400 14px 'Instrument Sans',sans-serif}
 
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);transition:all .25s;z-index:99;font-weight:600;font-size:13px}
.toast.show{opacity:1;transform:none}
 
/* Responsive */
@media(max-width:1020px){
  .layout{grid-template-columns:1fr}
  .preview-card{position:static;max-height:none}
}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.35)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>
 
<body>

  <aside class="sidebar" id="sidebar">

  <div class="main">

      <div style="display:flex;align-items:center;gap:12px">

</div>
<div class="toast" id="toast">Copied to clipboard</div>

/* ==========================================================================

   █ SECTION 1  SETTINGS         brands, article links, shared constants
   █ SECTION 2  HELPERS          small text helpers used by templates
   █ SECTION 3  PRE-MIGRATION    wording blocks + 5 email types (DNS option is a dropdown)
   █ SECTION 4  POST-MIGRATION   cPanel, TITAN (incl. secure link option), Exchange
   █ SECTION 5  GOOGLE WORKSPACE post-migration reply

   █ SECTION 7  DNS CHECKER      live lookup tool

   █ SECTION 9  ENGINE           rendering code — you normally never touch this
 
   TO EDIT WORDING: find the template in sections 3–6 and edit the text inside

/* Form fields for a pre-migration page */
function preFields(T) {
  const external = s => s.dns === 'external';
  const f = [
    { id: 'dns',           type: 'select', label: 'DNS management', options: DNS_OPTIONS },
    { id: 'sourcePlan',    type: 'text', label: 'Source plan',      placeholder: 'e.g. BizValue' },

    { type: 'heading', label: 'Schedule (optional)' },

    { id: 'schedTime', type: 'text', label: 'Scheduled time', placeholder: 'e.g. 10:00 AM', showIf: s => s.includeSchedule },
    { id: 'schedTz',   type: 'text', label: 'Time zone',      placeholder: 'e.g. AWST / AEST / IST / UTC', showIf: s => s.includeSchedule },

/* The generator: turns a PRE_TYPES entry into reply text */
function buildPre(T) {
  const C = PRE_COMMON;
  return (s, g) => {
    const external = s.dns === 'external';
    const withRecords = external && T.titanRecords && s.includeRecords;
    const n = (v, d) => (v && String(v).trim()) || d;
    const provider = n(s.remoteDns, '[DNS provider]');
    const names = clean(s.emailNames);
    const emailLine = `Email accounts: ${n(s.emailCount, '[count]')} email account(s) found under ${g.primary}` +
      (names.length ? `\n\nThey are:\n${names.join('\n')}\n` : '');
    const webLine = `Websites: ${n(s.websiteCount, '[count]')} website(s) hosted on the source plan (Status: ${n(s.websiteStatus, '[status]')})`;
    const nsLine = `Nameservers (NS): NS records are managed by ${external ? provider : 'us'}`;
    const findings = join([...T.order.map(k => (k === 'email' ? emailLine : webLine)), nsLine], '\n');
    const urls = clean(s.dnsUrls);
 
    /* Optional schedule line: "…scheduled for Monday, 23 November 2026 at 10:00 AM AWST." */
    let schedule = '';
    if (s.includeSchedule) {
      let dateText = '[date]';
      if (s.schedDate) {
        const d = new Date(s.schedDate + 'T00:00:00');
        if (!isNaN(d)) dateText = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }
      schedule = `This migration is currently scheduled for ${dateText} at ${n(s.schedTime, '[time]')} ${n(s.schedTz, '[time zone]')}.`;
    }
 
    const intro = join([
      `${C.greeting} We have received your ${T.request} for the following domain(s):`,
      g.domainLines,
      `This covers ${T.covers} from the ${n(s.sourcePlan, '[source plan]')} to the ${n(s.destPlan, '[destination plan]')}.`,
      schedule
    ]);
 
    const afterMigration = external
      ? join([
          `Since your NS records are managed by ${provider}, ${T.when}, ${T.externalNeeds} will need to be updated on your end to ensure ${T.why}.`,
          withRecords
            ? `${C.noAccessNote} The required records are listed below, so you (or your DNS provider) can add them once we confirm that the migration is complete.`
            : `${C.noAccessNote} We will share the ${T.closing === 'share' ? 'updated' : 'required'} DNS/server settings with you once the migration is complete, so you (or your DNS provider) can update the records accordingly.`,
          withRecords && titanRecordsBlock(g.brand)
        ])
      : join([
          `Since the NS records are managed by us, ${T.when}, ${T.managedNeeds} will need to be updated to ensure ${T.why}.`,
          C.managedNote
        ]);
 
    const pleaseNote = join([
      'Please note:',
      lines([ external ? C.propagationExternal : C.propagation, T.hasEmail && C.reconfigure ])
    ]);
 
    const closing =
      T.closing === 'share'        ? join([ 'We will share the updated DNS/server settings with you once the migration is complete.', C.thanks ]) :
      T.closing === 'update'       ? join([ 'We will update you once the migration is complete.', C.thanks ]) :
      T.closing === 'update-plain' ? 'We will update you once the migration is complete.' : '';
 
    /* Optional webmail access block (Titan / Exchange only) */
    let webmail = '';
    if (T.webmail && s.includeWebmail) {
      if (T.webmail === 'titan') {
        const wmEmail = s.wmMultiple ? 'Your full email address' : n(s.wmEmail, '[mailbox email]');
        webmail = s.wmSecure
          ? `You can find the login details for TITAN webmail at the following secure PrivateBin URL:\n${n(s.wmSecureUrl, '[secure credential URL]')}\n\nTITAN webmail login URL: ${g.brand.titanWebmail}`
          : `You can access the new Titan mailboxes using the webmail details below:\nWebmail: ${g.brand.titanWebmail}\nEmail: ${wmEmail}\nPassword: ${g.password(s.wmPassword)}`;
      } else {
        webmail = `You can access the new Exchange mailboxes using the webmail URL below:\n${n(s.wmUrl, '[webmail URL]')}\nTemporary Password:\n${g.password(s.wmPassword)}`;
      }
    }
 
    return join([
      intro,
      C.summaryTitle,
      C.summaryIntro,
      findings,
      `${C.dnsCheckIntro}\n${urls.length ? urls.join('\n') : '[DNS Checker URL]'}`,
      `We have also attached screenshots of the current ${T.screenshots} prior to the migration, for your reference.`,
      C.afterTitle,
      afterMigration,
      pleaseNote,
      webmail,
      closing
    ]);
  };
}

/* ██████████████████████  SECTION 7 — DNS CHECKER  ██████████████████████ */
 
const DNS = { text: '', status: '', results: null };
 
async function dohQuery(name, type) {
  try {
    const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`, { headers: { Accept: 'application/dns-json' } });
    const j = await r.json();
    return j.Answer || [];
  } catch (e) { return []; }
}
 
async function runDnsLookup() {
  const domains = DNS.text.split('\n').map(x => x.trim()).filter(Boolean);
  if (!domains.length) { DNS.status = 'Please enter at least one domain.'; return drawDns(); }
  DNS.status = `Querying live DNS records for ${domains.length} domain(s)…`; DNS.results = null; drawDns();
 
  const results = [];
  for (const domain of domains) {
    const [a, ns, mx] = await Promise.all([dohQuery(domain, 'A'), dohQuery(domain, 'NS'), dohQuery(domain, 'MX')]);
    const mxHostA = [];
    for (const m of mx) {
      const host = m.data.trim().split(/\s+/).pop().replace(/\.$/, '');   // "10 mail.x.com." -> "mail.x.com"
      const recs = await dohQuery(host, 'A');
      recs.forEach(r => mxHostA.push(`${host} → ${r.data}`));
    }
    results.push({ domain, a: a.map(x => x.data), ns: ns.map(x => x.data), mx: mx.map(x => x.data), mxHostA });
  }
  DNS.results = results;
  DNS.status = `Done — ${domains.length} domain(s) processed.`;
  drawDns();
}
 
function dnsCell(arr, label) {
  return arr.length ? arr.map(x => `<div>${esc(x)}</div>`).join('') : `<span class="ap-none">${label}</span>`;
}
 
function drawDns() {
  const rows = DNS.results
    ? DNS.results.map(r => `<tr>
        <td class="dom">${esc(r.domain)}</td>
        <td>${dnsCell(r.a, 'No A record')}</td>
        <td>${dnsCell(r.ns, 'No NS record')}</td>
        <td>${dnsCell(r.mx, 'No MX record')}</td>
        <td>${dnsCell(r.mxHostA, 'No MX host A')}</td></tr>`).join('')
    : `<tr><td colspan="5" class="ap-empty">Enter domains above and click “Lookup DNS Records”.</td></tr>`;
 
  $('#view').innerHTML = `
    <div class="apple"><div class="glass">
      <h2>DNS Record Checker</h2>
      <p class="sub">Enter one domain per line to see its A, NS and MX records, plus the A records of the MX hosts.</p>
      <textarea id="dnsInput" rows="5" placeholder="example.com">${esc(DNS.text)}</textarea>
      <div class="ap-row">
        <button class="ap-btn" id="dnsRun" type="button">Lookup DNS Records</button>
        <button class="ap-btn soft" id="dnsCopy" type="button">Copy results</button>
        <span class="ap-status">${esc(DNS.status)}</span>
      </div>
      <div class="ap-table"><table>
        <thead><tr><th>Domain</th><th>A Records</th><th>NS Records</th><th>MX Records</th><th>MX Host A</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div></div>`;
  $('#dnsInput').addEventListener('input', e => { DNS.text = e.target.value; });
  $('#dnsRun').addEventListener('click', runDnsLookup);
  $('#dnsCopy').addEventListener('click', () => {
    if (!DNS.results) return;
    copyText(DNS.results.map(r => `Domain: ${r.domain}\nA: ${r.a.join(', ') || 'None'}\nNS: ${r.ns.join(', ') || 'None'}\nMX: ${r.mx.join(', ') || 'None'}\nMX Host A: ${r.mxHostA.join(', ') || 'None'}`).join('\n-----------------------------------\n'));
  });
}
 
register({ id: 'tool-dns', title: 'DNS Record Checker', custom: drawDns });

/* Registry ------------------------------------------------------------- */
function defaultsOf(t) {
  const s = {};
  (t.fields || []).forEach(f => {
    if (!f.id) return;
    if (f.type === 'list')        s[f.id] = [...(f.default !== undefined ? f.default : [''])];
    else if (f.type === 'check')  s[f.id] = f.default || false;
    else if (f.type === 'toggle' || f.type === 'select') s[f.id] = f.default !== undefined ? f.default : f.options[0].v;
    else                          s[f.id] = f.default !== undefined ? f.default : '';
  });
  return s;
}
function register(t) { REG[t.id] = t; STATE[t.id] = defaultsOf(t); }
 
/* Shared (global) fields ---------------------------------------------- */
const GLOBAL = { domains: '', ticket: '', brand: 'crazydomains', autoPw: true };
 
function ctx() {
  const domains = GLOBAL.domains.split(/[\n,]+/).map(x => x.trim()).filter(Boolean);
  const list = domains.length ? domains : ['[domain]'];
  const human = list.length === 1 ? list[0]
              : list.length === 2 ? `${list[0]} and ${list[1]}`
              : `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`;
  return {
    domains: list,
    primary: list[0],
    domainList: human,
    domainLines: list.join('\n'),
    ticket: GLOBAL.ticket.trim(),
    brand: BRANDS[GLOBAL.brand],
    password: (explicit) => (explicit || '').trim() || (GLOBAL.autoPw ? `Migrate@${GLOBAL.ticket.trim() || '[Ticket ID]'}` : '[password]')
  };
}
 
/* Utilities ------------------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
 
let current = null, OUT = '', OUTS = [];
 
function toast(msg) {
  const el = $('#toast'); el.textContent = msg || 'Copied to clipboard'; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast();
}
 
/* Rendering ------------------------------------------------------------ */
function globalsHTML(t) {
  const g = t.globals || [];
  let h = '';
  if (g.includes('domains')) h += `<h3>Case details</h3>
    <div class="field"><label>Domain(s)</label>
      <textarea data-g="domains" rows="2" placeholder="One per line or comma-separated&#10;example.com">${esc(GLOBAL.domains)}</textarea></div>`;
  if (g.includes('ticket')) h += `<div class="field"><label>Ticket ID</label>
      <input type="text" data-g="ticket" value="${esc(GLOBAL.ticket)}" placeholder="E-586620"></div>
      <label class="check"><input type="checkbox" data-g="autoPw" ${GLOBAL.autoPw ? 'checked' : ''}><span>Auto-fill password as Migrate@[Ticket ID]</span></label>`;
  if (g.includes('brand')) h += `<div class="field"><label>Brand</label><div class="toggle">
      ${Object.entries(BRANDS).map(([k, b]) => `<button type="button" data-gbrand="${k}" class="${GLOBAL.brand === k ? 'on' : ''}">${b.label}</button>`).join('')}</div></div>`;
  return h;
}
 
function fieldHTML(f, s) {
  if (f.showIf && !f.showIf(s)) return '';
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  const v = f.id ? s[f.id] : null;
  switch (f.type) {
    case 'heading':  return `<h3>${f.label}</h3>`;
    case 'text':
    case 'date':     return `<div class="field"><label>${f.label}</label><input type="${f.type}" data-f="${f.id}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}">${hint}</div>`;
    case 'textarea': return `<div class="field"><label>${f.label}</label><textarea data-f="${f.id}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>${hint}</div>`;
    case 'check':    return `<label class="check"><input type="checkbox" data-f="${f.id}" ${v ? 'checked' : ''}><span>${f.label}</span></label>`;
    case 'select':   return `<div class="field"><label>${f.label}</label><select data-f="${f.id}">${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${o.l}</option>`).join('')}</select>${hint}</div>`;
    case 'toggle':   return `<div class="field"><label>${f.label}</label><div class="toggle">${f.options.map(o => `<button type="button" data-tf="${f.id}" data-v="${esc(o.v)}" class="${o.v === v ? 'on' : ''}">${o.l}</button>`).join('')}</div>${hint}</div>`;
    case 'list': {
      const rows = v.map((x, i) => `<div class="list-row"><input type="text" data-f="${f.id}" data-i="${i}" value="${esc(x)}" placeholder="${esc(f.placeholder || '')}"><button type="button" class="mini" data-del="${f.id}" data-i="${i}" title="Remove">✕</button></div>`).join('');
      return `<div class="field"><label>${f.label}</label>${rows || '<div class="hint" style="margin:0 0 6px">None added yet</div>'}<button type="button" class="link-btn" data-add="${f.id}">+ ${f.addLabel || 'Add'}</button></div>`;
    }
    case 'button':   return `<div class="field"><button type="button" class="btn" data-act="${f.id}">${f.label}</button></div>`;
  }
  return '';
}
 
function renderForm() {
  const t = REG[current], s = STATE[current];
  $('#form').innerHTML = globalsHTML(t) + t.fields.map(f => fieldHTML(f, s)).join('');
}
 
function regen() {
  const t = REG[current];
  if (t.outputs) {
    OUTS = t.outputs.map(o => o.build(STATE[current], ctx()));
    OUTS.forEach((txt, i) => {
      $('#output' + i).textContent = txt;
      $('#wc' + i).textContent = `${txt.trim().split(/\s+/).filter(Boolean).length} words`;
    });
    return;
  }
  OUT = t.build(STATE[current], ctx());
  OUTS = [OUT];
  $('#output').textContent = OUT;
  const words = OUT.trim().split(/\s+/).filter(Boolean).length;
  $('#wc').textContent = `${words} words`;
  $('#cc').textContent = `${OUT.length} characters`;
}

      ${t.outputs ? multiPreviewHTML(t) : `<div class="card preview-card">
        <div class="preview-head">
          <div><span class="tag">${esc(t.tag || '')}</span><div class="t">${esc(t.title)}</div></div>
          <div style="display:flex;gap:8px"><button class="btn" id="resetBtn" type="button">Reset</button><button class="btn primary" id="copyBtn" data-copy="0" type="button">Copy</button></div>
        </div>
        <div class="terminal"><div class="bar"><i></i><i></i><i></i></div><pre id="output"></pre></div>
        <div class="status"><span id="wc"></span><span id="cc"></span></div>
      </div>`}
    </div>`;
  renderForm(); regen();
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    await copyText(OUTS[+b.dataset.copy]);
    b.textContent = 'Copied ✓'; b.classList.add('copied');
    setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('copied'); }, 1500);
  }));
  $('#resetBtn').addEventListener('click', () => { STATE[current] = defaultsOf(REG[current]); renderForm(); regen(); });
  bindFormEvents();
}
 
function showSoon(label) {
  $('#view').innerHTML = `<div class="card soon-card"><div class="ico">🚧</div><h2>${esc(label)}</h2>
    <p>This section is reserved and coming soon.</p>
    <p style="font-size:13px">Will be updated in a future release.</p></div>`;
}
 
/* Form events (delegated — bound once per template view) --------------- */
function bindFormEvents() {
  const form = $('#form');
  const S = () => STATE[current];
 
  form.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.g) { GLOBAL[el.dataset.g] = el.value; return regen(); }
    if (!el.dataset.f || el.type === 'checkbox' || el.tagName === 'SELECT') return;
    if (el.dataset.i !== undefined) S()[el.dataset.f][+el.dataset.i] = el.value;
    else S()[el.dataset.f] = el.value;
    regen();
  });
 
  form.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.g === 'autoPw') { GLOBAL.autoPw = el.checked; return regen(); }
    if (!el.dataset.f) return;
    if (el.type === 'checkbox') S()[el.dataset.f] = el.checked;
    else if (el.tagName === 'SELECT') S()[el.dataset.f] = el.value;
    else return;
    renderForm(); regen();           // re-render so showIf rules update
  });
 
  form.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const s = S(), t = REG[current];
    if (b.dataset.gbrand)  { GLOBAL.brand = b.dataset.gbrand; renderForm(); return regen(); }
    if (b.dataset.tf)      { s[b.dataset.tf] = b.dataset.v; renderForm(); return regen(); }
    if (b.dataset.add)     { s[b.dataset.add].push(''); renderForm(); return regen(); }
    if (b.dataset.del)     { s[b.dataset.del].splice(+b.dataset.i, 1); renderForm(); return regen(); }
    if (b.dataset.act)     { const f = t.fields.find(x => x.id === b.dataset.act); f.run(s); renderForm(); return regen(); }
  });
}
 
/* Navigation ----------------------------------------------------------- */
function buildNav() {
  $('#nav').innerHTML = NAV.map(g => `
    <div class="nav-group" style="--c:${g.color}">
      <div class="nav-group-label"><i></i>${g.group}</div>
      ${g.sections.map(sec => `
        ${sec.sub ? `<div class="nav-sub" style="--c:${sec.color}">${sec.sub}</div>` : ''}
        ${sec.items.map(it => `<button type="button" class="nav-item" data-id="${it.id}" data-group="${esc(g.group)}">
            <span>${it.label}</span>${it.soon ? '<span class="soon">Soon</span>' : ''}</button>`).join('')}
      `).join('')}
    </div>`).join('');
}
 
function findNavItem(id) {
  for (const g of NAV) for (const sec of g.sections) for (const it of sec.items) if (it.id === id) return { it, g, sec };
  return null;
}
 
function go(id) {
  const found = findNavItem(id); if (!found) return;
  current = id;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const t = REG[id];
  $('#crumb').textContent = found.g.group + (found.sec.sub ? ' · ' + found.sec.sub : '');
  $('#pageTitle').textContent = t ? t.title : found.it.label;
  if (found.it.soon || !t) showSoon(found.it.label);
  else if (t.custom) t.custom();
  else showTemplate(t);
  $('#sidebar').classList.remove('open');
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
 
/* Theme + mobile menu -------------------------------------------------- */
function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  document.querySelectorAll('#themeToggle span').forEach(x => x.classList.toggle('on', x.dataset.t === th));
  try { localStorage.setItem('migrationHubTheme', th); } catch (e) {}
}
document.querySelectorAll('#themeToggle span').forEach(x => x.addEventListener('click', () => setTheme(x.dataset.t)));
setTheme(document.documentElement.getAttribute('data-theme') || 'light');
$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
 
/* Boot ----------------------------------------------------------------- */
buildNav();
$('#nav').addEventListener('click', e => { const b = e.target.closest('.nav-item'); if (b) go(b.dataset.id); });
go(location.hash.slice(1) && findNavItem(location.hash.slice(1)) ? location.hash.slice(1) : 'pre-cpanel');
</script>
</body>
</html>
